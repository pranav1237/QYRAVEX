[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zetheta-workbridge"
version = "0.1.0"
description = "Auditable autonomous financial research agent"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.7,<3", "python-dotenv>=1.0,<2", "rich>=13.7,<15", "typer>=0.12,<1", "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.5,<1", "mypy>=1.10,<2"]
semantic = ["sentence-transformers>=3,<6"]

[project.scripts]
workbridge = "workbridge.cli:app"
workbridge-web = "workbridge.web:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
workbridge = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
